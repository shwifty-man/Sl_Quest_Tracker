version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend          # backend is the build context
    working_dir: /app             # set container working directory
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_db
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app            # mount host backend folder to container
      - /app/node_modules         # keep container node_modules
    command: npm run dev          # run nodemon

volumes:
  db_data:
